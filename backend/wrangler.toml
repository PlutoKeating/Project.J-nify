name = "j-nify-backend"
main = "src/index.ts"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"] # Worker 告警 SMTP 客户端使用 node:net/tls
workers_dev = true


[vars]
APP_ENV = "production"
APP_VERSION = "0.3.0"
CORS_ORIGINS = "*"
LOG_LEVEL = "info"
RATE_LIMIT_PER_MINUTE = "60"
QUIET_HOURS_START = "23:30"
QUIET_HOURS_END = "08:30"
MAX_NUDGE_BUDGET = "3"
LLM_API_BASE = ""
LLM_MODEL = ""
# 注意：JNIFY_DATA_URL / JNIFY_DATA_KEY（jnify-data 数据服务）及 SMTP/Admin/外部服务凭据为 Worker secrets，
# 不写入本文件；本地开发放 .dev.vars（已被 .gitignore 忽略）。登录校验用的账号服务地址 ID_ISSUER 缺省为 https://id.plutokeating.beer/。
