name = "j-nify-backend"
main = "src/index.ts"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"] # postgres.js/drizzle 需 Node 兼容层（node:events/net/tls 等）
workers_dev = true

[vars]
APP_ENV = "production"
APP_VERSION = "0.1.0"
CORS_ORIGINS = "*"
LOG_LEVEL = "info"
RATE_LIMIT_PER_MINUTE = "60"
QUIET_HOURS_START = "23:30"
QUIET_HOURS_END = "08:30"
MAX_NUDGE_BUDGET = "3"
LLM_API_BASE = ""
LLM_MODEL = ""
# 注意：SUPABASE_URL/DATABASE_URL/LLM_API_KEY 为 secret，在 CF Dashboard 注入，
# 不写入本文件；本地开发放 .dev.vars（已被 .gitignore 忽略）。