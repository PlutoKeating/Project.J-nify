name: jnify_app
description: "J-nify — 懂 P 人的 J 人助理（Jennifer）客户端。spec 见 docs/SPEC.md。"
publish_to: 'none'
# version：`+N` 是 Android versionCode / iOS CFBundleVersion，**必须随发版严格递增**，
# 且大于历史最大值。历史最大 = 5（v0.2.0=0.2.0+5）；v0.1.3/v0.1.4 均误用 +1 致
# versionCode=1 < 3，覆盖安装被拒（INSTALL_FAILED_VERSION_DOWNGRADE）。v0.3.0 用 +6。
version: 0.3.0+6

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # Backend 地址等配置完全由 .env 控制（见 .env.example）
  app_links: ^7.2.1
  flutter_dotenv: ^6.0.1
  flutter_local_notifications: ^22.3.0
  flutter_markdown_plus: ^1.0.12
  flutter_timezone: ^5.1.0
  geolocator: ^14.0.3
  http: ^1.2.0
  path: ^1.9.0
  # 13.x requires unreleased stable Android compileSdk 37; stay on latest 12.x.
  permission_handler: ^12.0.3
  # 运行时读取包版本/构建号（About us 展示）
  package_info_plus: ^10.2.1
  shared_preferences: ^2.3.3
  sqflite: ^2.4.1
  supabase_flutter: ^2.17.2
  timezone: ^0.11.1

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.4.2+1

flutter:
  uses-material-design: true
