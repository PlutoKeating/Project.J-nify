name: jnify_app
description: "J-nify — 懂 P 人的 J 人助理（Jennifer）客户端。spec 见 docs/SPEC.md。"
publish_to: 'none'
# version：`+N` 是 Android versionCode / iOS CFBundleVersion，**必须随发版严格递增**，
# 且大于历史最大值。历史最大 = 4（v0.1.5=0.1.5+4）；v0.1.3/v0.1.4 均误用 +1 致
# versionCode=1 < 3，覆盖安装被拒（INSTALL_FAILED_VERSION_DOWNGRADE）。v0.2.0 用 +5。
version: 0.2.0+5

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # Backend 地址等配置完全由 .env 控制（见 .env.example）
  app_links: ^7.2.1
  flutter_dotenv: ^5.1.0
  flutter_local_notifications: ^17.2.4
  flutter_timezone: ^4.1.0
  geolocator: ^13.0.2
  http: ^1.2.0
  path: ^1.9.0
  permission_handler: ^11.3.1
  # 运行时读取包版本/构建号（About us 展示）
  package_info_plus: ^8.0.0
  shared_preferences: ^2.3.3
  sqflite: ^2.4.1
  supabase_flutter: ^2.17.2
  timezone: ^0.9.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
