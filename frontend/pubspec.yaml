name: jnify_app
description: "J-nify — 懂 P 人的 J 人助理（Jennifer）客户端。spec 见 docs/SPEC.md。"
publish_to: 'none'
version: 0.1.3+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # Backend 地址等配置完全由 .env 控制（见 .env.example）
  flutter_dotenv: ^5.1.0
  http: ^1.2.0
  # 运行时读取包版本/构建号（About us 展示）
  package_info_plus: ^8.0.0
  supabase_flutter: ^2.17.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
