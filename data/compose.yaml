# jnify-data：一个容器。只发布到本机 127.0.0.1:${JNIFY_DATA_LOCAL_PORT}，由服务器上已有的 Cloudflare Tunnel 转发
# （公共主机名 data.jnify.plutokeating.beer → http://localhost:8789）。数据在 ./data（SQLite 与每日备份）。
# 变量来自同目录的 .env（start.sh 生成，权限 600，不入库）。
name: jnify-data

services:
  data:
    build:
      context: .
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:24-alpine@sha256:ebfe2f90462722a7a4de65e91990e97fe0d401c70e0e762c5b53302f905ec1c1}
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org}
    image: jnify-data:local
    restart: unless-stopped
    environment:
      JNIFY_DATA_KEY: ${JNIFY_DATA_KEY:?请运行 ./start.sh 生成 JNIFY_DATA_KEY}
      JNIFY_DATA_DIR: /data
      JNIFY_DATA_PORT: "8080"
    ports:
      - "127.0.0.1:${JNIFY_DATA_LOCAL_PORT:-8789}:8080"
    volumes:
      - ./data:/data
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 192m
    pids_limit: 64
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
