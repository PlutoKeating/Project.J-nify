# 运维工具：把 GH Secrets 中的 SMTP/会话等配置写入 CF Worker Secrets（j-nify-backend）。
# 触发：Actions → Configure Worker Secrets (Ops) → Run workflow → confirm 填 YES。
# 安全性：值全部来自 GH Secrets（自动掩码）；工作流只写 JSON 文件给 wrangler，不回显内容；
# 仅在 confirm == 'YES' 时执行。真值不入库，命名登记见 docs/devops/SECRETS_REGISTRY.md。
name: Configure Worker Secrets (Ops)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type YES to apply CF Worker secrets from GH Secrets'
        required: true
        default: 'NO'

permissions:
  contents: read

jobs:
  apply:
    name: Apply secrets to j-nify-backend
    runs-on: ubuntu-latest
    if: github.event.inputs.confirm == 'YES'
    steps:
      - uses: actions/checkout@v4

      - name: Build secrets JSON (values from GH Secrets, never echoed)
        working-directory: backend
        run: |
          python3 - <<'PY'
          import json, os
          required = ["SMTP_HOST", "SMTP_PORT", "SMTP_USER", "SMTP_AUTH", "SESSION_SECRET"]
          optional = ["ADMIN_USERNAME", "ADMIN_PASSWORD", "GH_PAT"]
          s = {}
          for k in required:
              v = os.environ.get(k, "")
              if not v:
                  raise SystemExit(f"missing secret: {k}")
              s[k] = v
          for k in optional:
              v = os.environ.get(k, "")
              if v:
                  s[k] = v
          with open("cf-secrets.json", "w") as f:
              json.dump(s, f, indent=2)
          PY
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_AUTH: ${{ secrets.SMTP_AUTH_PROD }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          GH_PAT: ${{ secrets.GH_PAT }}

      - name: Apply secrets via wrangler
        working-directory: backend
        run: npx wrangler secret bulk cf-secrets.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify applied secret names
        working-directory: backend
        run: npx wrangler secret list
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
