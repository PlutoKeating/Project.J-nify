# 前端 APP 自动打包发布：推送 tag vX.Y.Z 触发。
# - 唯一版本来源：frontend/pubspec.yaml 的 version（tag 与之一致才放行，否则 fail-fast）
# - Android：ubuntu 上构建 release APK + AAB（当前无签名密钥 → 未签名）
# - iOS：macos 上 flutter build ipa --no-codesign（未签名）
# - 汇总 job 把产物挂到 GitHub Release
# 后端部署不在此工作流内：维持 Cloudflare Dashboard git 集成（Root directory=backend）。
name: Release Frontend

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # softprops/action-gh-release 创建 Release
  actions: write    # upload-artifact / download-artifact（@v4 需要）

jobs:
  validate:
    name: Validate tag matches pubspec version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compare tag with frontend/pubspec.yaml version
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os, re, sys, pathlib

          tag = os.environ["GITHUB_REF_NAME"]
          pub = pathlib.Path("frontend/pubspec.yaml").read_text(encoding="utf-8")
          m = re.search(r"^version:\s*(\S+)\s*$", pub, re.M)
          if not m:
              print("::error::frontend/pubspec.yaml 缺少 version 字段")
              sys.exit(1)
          pub_ver = m.group(1).split("+")[0]  # 0.1.0+1 -> 0.1.0（build number 不入 tag）
          expected = "v" + pub_ver
          if tag != expected:
              print(f"::error::tag '{tag}' 与 frontend/pubspec.yaml version '{pub_ver}' 不一致（期望 {expected}）")
              sys.exit(1)
          print(f"OK: tag {tag} 与 frontend/pubspec.yaml version {pub_ver} 一致")
          PY

  android:
    name: Build Android APK + AAB
    needs: validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}

      - name: Build release AAB
        run: flutter build appbundle --release --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-artifacts
          if-no-files-found: error
          path: |
            frontend/build/app/outputs/flutter-apk/app-release.apk
            frontend/build/app/outputs/bundle/release/app-release.aab

  ios:
    name: Build iOS ipa (no codesign)
    needs: validate
    runs-on: macos-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # ios/ 平台目录已入库；无需 ensure。构建时注入 Supabase 配置（secrets），
      # 运行时可选签名（当前 --no-codesign）。
      - name: Install dependencies
        run: flutter pub get

      - name: Build unsigned archive (ipa needs Apple signing)
        run: flutter build ipa --no-codesign --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}

      # --no-codesign 只产出 xcarchive（iOS 签名 IPA 需 Apple Developer 证书，后续接）
      - name: Upload iOS archive
        uses: actions/upload-artifact@v4
        with:
          name: ios-artifacts
          if-no-files-found: error
          path: frontend/build/ios/archive/Runner.xcarchive

  release:
    name: Create GitHub Release
    # MVP 安装包 = Android APK；iOS 为 xcarchive 附加产物，失败不阻塞发布
    needs: [android]
    runs-on: ubuntu-latest
    steps:
      - name: Download Android artifacts
        uses: actions/download-artifact@v4
        with:
          name: android-artifacts
          path: android

      - name: Download iOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: ios-artifacts
          path: ios

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: J-nify ${{ github.ref_name }}
          body: |
            ## J-nify ${{ github.ref_name }}

            > 版本来源：frontend/pubspec.yaml（详见 `docs/devops/release.md`）。

            ### 产物
            - **APK**（`app-release.apk`）：Android 直接安装包
            - **AAB**（`app-release.aab`）：Google Play 上架用
            - **XCArchive**（`Runner.xcarchive`）：iOS 归档（**未签名**，需 Apple 证书签名后分发）

            ### ⚠️ 当前为无签名构建
            - Android：未配置 keystore（使用调试签名占位），正式上架前需接入签名（见 `docs/devops/release.md`「签名接入」）。
            - iOS：`--no-codesign` 构建仅产出归档，未签名无法直接安装到真机；需 Apple Developer 证书签名/公证。
          files: |
            android/frontend/build/app/outputs/flutter-apk/app-release.apk
            android/frontend/build/app/outputs/bundle/release/app-release.aab
