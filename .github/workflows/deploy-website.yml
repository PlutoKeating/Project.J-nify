# 官网部署（Cloudflare Pages，CI 直发，不依赖 git 集成）
# - 项目名：优先 vars.PAGES_PROJECT_NAME，否则 CF API 自动识别
# - 分支：使用项目实际 production_branch（不再硬编码 main）
# - 冒烟测试：部署后校验 pages.dev 子路由 SPA 回退（200）
name: Deploy Website (Cloudflare Pages)

on:
  push:
    branches: [main]
    paths:
      - website/**
      - .github/workflows/deploy-website.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Build & deploy website to Pages
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install & build
        run: |
          npm ci
          npm run build
          test -f dist/_redirects && echo "dist/_redirects OK"

      - name: Resolve Pages project
        id: project
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PAGES_PROJECT_NAME: ${{ vars.PAGES_PROJECT_NAME }}
        run: |
          if [ -n "$PAGES_PROJECT_NAME" ]; then
            echo "name=$PAGES_PROJECT_NAME" >> "$GITHUB_OUTPUT"
            echo "detected=$PAGES_PROJECT_NAME"
            exit 0
          fi
          curl -sS -m 30 "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" > /tmp/projects.json
          NAME="$(python3 -c 'import json;d=json.load(open("/tmp/projects.json"));r=d.get("result") or [];print(r[0]["name"] if r else "")')"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "detected=$NAME"

      - name: Fetch project settings
        id: settings
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          curl -sS -m 30 "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/${{ steps.project.outputs.name }}" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" > /tmp/project.json
          python3 - <<'PY'
          import json, os
          d = json.load(open('/tmp/project.json'))
          r = d.get('result') or {}
          pb = str(r.get('production_branch') or 'main')
          domains = ','.join(r.get('domains') or [])
          dep = r.get('latest_deployment') or {}
          out = os.environ.get('GITHUB_OUTPUT', '')
          with open(out, 'a') as f:
              f.write(f'production_branch={pb}\n')
              f.write(f'domains={domains}\n')
              f.write(f'latest_deployment_id={dep.get("id")}\n')
              f.write(f'latest_deployment_url={dep.get("url")}\n')
          print('production_branch=' + pb)
          print('domains=' + domains)
          print('latest_deployment_url=' + str(dep.get('url')))
          PY

      - name: Deploy to Pages
        run: |
          PROJ="${{ steps.project.outputs.name }}"
          BRANCH="${{ steps.settings.outputs.production_branch }}"
          [ -n "$BRANCH" ] || BRANCH="main"
          echo "project=$PROJ branch=$BRANCH"
          npx wrangler pages deploy dist --project-name "$PROJ" --branch "$BRANCH"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Smoke test (SPA fallback)
        run: |
          fail=0
          for URL in "https://j-nify-website.pages.dev" "https://j-nify.arr2018.dpdns.org"; do
            for p in features download privacy auth/verify; do
              code=$(curl -sS -m 20 -o /dev/null -w '%{http_code}' "$URL/$p")
              echo "$URL /$p -> $code"
              [ "$code" = "200" ] || fail=1
            done
          done
          [ "$fail" = "0" ] || { echo "SMOKE TEST FAILED: expected 200 for all SPA routes"; exit 1; }
