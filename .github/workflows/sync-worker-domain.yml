# 运维工具：把 Worker 自定义域名切到正确域名（j-nify.williamhvollita.dpdns.org）。
# 触发：Actions → Sync Worker Domain (Ops) → confirm=YES。
# 说明：旧域名 jnify.williamhvollita.dpdns.org（无连字符）默认保留为兼容别名；
# 如需移除，额外填 remove_old=true。
name: Sync Worker Domain (Ops)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type YES to apply'
        required: true
        default: 'NO'
      remove_old:
        description: 'Remove old domain jnify.williamhvollita.dpdns.org'
        required: false
        default: 'false'

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    if: github.event.inputs.confirm == 'YES'
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      NEW_DOMAIN: j-nify.williamhvollita.dpdns.org
      OLD_DOMAIN: jnify.williamhvollita.dpdns.org
      ZONE_NAME: williamhvollita.dpdns.org
      WORKER: j-nify-backend
    steps:
      - name: Get zone id
        id: zone
        run: |
          curl -sS -m 30 "https://api.cloudflare.com/client/v4/zones?name=$ZONE_NAME&per_page=1" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" > /tmp/zone.json
          python3 - <<'PY'
          import json, os
          d = json.load(open('/tmp/zone.json'))
          zid = (d.get('result') or [{}])[0].get('id') or ''
          with open(os.environ.get('GITHUB_OUTPUT',''), 'a') as f:
              f.write(f'zone_id={zid}\n')
          print('zone_id=' + zid)
          PY

      - name: List current worker domains
        run: |
          curl -sS -m 30 "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/domains?zone_id=${{ steps.zone.outputs.zone_id }}" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" > /tmp/domains.json
          python3 - <<'PY'
          import json
          d = json.load(open('/tmp/domains.json'))
          for x in (d.get('result') or []):
              print(x.get('hostname'), x.get('id'), x.get('service'))
          PY

      - name: Add new domain (auto DNS record)
        env:
          ZONE_ID: ${{ steps.zone.outputs.zone_id }}
        run: |
          python3 - <<'PY'
          import json, os
          existing = json.load(open('/tmp/domains.json')).get('result') or []
          if any(x.get('hostname') == os.environ['NEW_DOMAIN'] for x in existing):
              print('new domain already bound; skip add')
              raise SystemExit(0)
          body = {"hostname": os.environ['NEW_DOMAIN'], "service": os.environ['WORKER'], "zone_id": os.environ['ZONE_ID']}
          open('/tmp/add.json', 'w').write(json.dumps(body))
          PY
          if [ -f /tmp/add.json ]; then
            curl -sS -m 30 -X POST "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/domains" \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Content-Type: application/json' --data-binary @/tmp/add.json
          fi

      - name: Remove old domain (optional)
        if: github.event.inputs.remove_old == 'true'
        run: |
          ID="$(python3 -c 'import json,os;d=json.load(open("/tmp/domains.json"));print(next((x.get("id") for x in (d.get("result") or []) if x.get("hostname")==os.environ["OLD_DOMAIN"]), ""))')"
          if [ -n "$ID" ]; then
            curl -sS -m 30 -X DELETE "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/domains/$ID" \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          else
            echo "old domain not found; skip"
          fi

      - name: Verify final domains
        run: |
          curl -sS -m 30 "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/domains?zone_id=${{ steps.zone.outputs.zone_id }}" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" | python3 -c "import json,sys;print([x.get('hostname') for x in (json.load(sys.stdin).get('result') or [])])"
