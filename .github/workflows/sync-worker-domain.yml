# 运维工具：把 Worker 域名切到正确域名（j-nify.williamhvollita.dpdns.org）。
# 实现：Zone Workers Routes + 代理 DNS 记录（Custom Domains API 需更高 token 权限，回退方案）。
# 触发：Actions → Sync Worker Domain (Ops) → confirm=YES。
name: Sync Worker Domain (Ops)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type YES to apply'
        required: true
        default: 'NO'

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    if: github.event.inputs.confirm == 'YES'
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      NEW_DOMAIN: j-nify.williamhvollita.dpdns.org
      ZONE_NAME: williamhvollita.dpdns.org
      WORKER: j-nify-backend
    steps:
      - name: Get zone id
        id: zone
        run: |
          curl -sS -m 30 "https://api.cloudflare.com/client/v4/zones?name=$ZONE_NAME&per_page=1" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" > /tmp/zone.json
          python3 - <<'PY'
          import json, os
          d = json.load(open('/tmp/zone.json'))
          zid = (d.get('result') or [{}])[0].get('id') or ''
          with open(os.environ.get('GITHUB_OUTPUT',''), 'a') as f:
              f.write(f'zone_id={zid}\n')
          print('zone_id=' + zid)
          PY

      - name: Create proxied DNS record (A placeholder)
        env:
          ZONE_ID: ${{ steps.zone.outputs.zone_id }}
        run: |
          curl -sS -m 30 -X POST "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Content-Type: application/json' \
            --data '{"type":"A","name":"j-nify","content":"192.0.2.1","proxied":true,"ttl":1}'

      - name: Add worker route
        env:
          ZONE_ID: ${{ steps.zone.outputs.zone_id }}
        run: |
          curl -sS -m 30 -X POST "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/workers/routes" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Content-Type: application/json' \
            --data "{\"pattern\":\"$NEW_DOMAIN/*\",\"script\":\"$WORKER\"}"

      - name: Verify routes + live domain
        env:
          ZONE_ID: ${{ steps.zone.outputs.zone_id }}
        run: |
          echo '--- routes ---'
          curl -sS -m 30 "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/workers/routes" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" | python3 -c "import json,sys;print([(x.get('pattern'),x.get('script')) for x in (json.load(sys.stdin).get('result') or [])])"
          echo '--- curl new domain ---'
          for i in 1 2 3; do
            code=$(curl -sS -m 20 -o /dev/null -w '%{http_code}' "https://$NEW_DOMAIN/" || true)
            echo "attempt $i: $code"
            [ "$code" = "200" ] && break
            sleep 5
          done
