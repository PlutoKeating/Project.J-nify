name: Deploy (Cloudflare Workers：官网 + 接口)

on:
  push:
    branches: [main]
    paths:
      - backend/**
      - website/**
      - .github/workflows/deploy-backend.yml
  workflow_dispatch: # 手动重部署入口：Actions → Deploy Backend → Run workflow

concurrency:
  group: backend-deploy
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24 # 与 CI 一致（npm 11）；npm 10 的 npm ci 会拒绝 npm11 生成的 lockfile
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            website/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      # 官网由同一个 Worker 托管（wrangler.toml 的 [assets] 指向 website/dist），部署前先构建
      - name: Build website
        working-directory: website
        run: npm ci && npm run build

      # CI 已跑 test/typecheck；部署 job 精简为直接上线。
      # 运行期 secrets（JNIFY_DATA_URL / JNIFY_DATA_KEY / LLM_API_KEY 等）在 CF Dashboard
      # 的 Worker → Settings → Variables and Secrets 维护，wrangler deploy 不会覆盖。
      - name: Deploy with Wrangler
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
          workingDirectory: backend